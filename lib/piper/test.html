<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prova voci Piper</title>
<style>
:root{--bg:#14161a;--card:#1f2228;--txt:#eceff4;--mut:#9aa3b2;--acc:#ffb454;--bd:#343944}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,system-ui,sans-serif;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));line-height:1.45}
h1{font-size:20px;margin:0 0 4px}
p.s{color:var(--mut);margin:0 0 14px;font-size:14px}
label{display:block;color:var(--mut);font-size:13px;margin:14px 0 4px}
select,textarea,button{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;width:100%}
textarea{min-height:130px;font-size:16px}
button{font-weight:700;margin-top:10px}
button.acc{background:var(--acc);color:#1a1200;border:none;font-size:18px;padding:16px}
.bar{height:8px;background:var(--bd);border-radius:4px;margin-top:8px;display:none;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
#info{font-size:14px;color:var(--mut);margin-top:8px;min-height:20px}
#sent{margin-top:14px;font-family:Georgia,serif;font-size:18px}
#sent span{padding:1px 2px;border-radius:4px}
#sent span.cur{background:#3a3320;color:#fff}
#log{margin-top:14px;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--mut);white-space:pre-wrap;background:#0f1114;border-radius:10px;padding:10px;min-height:60px}
.row{display:flex;gap:10px}.row>*{flex:1}
input[type=range]{width:100%;accent-color:var(--acc)}
</style>
</head>
<body>
<h1>🎙️ Prova voci Piper</h1>
<p class="s">Voci neurali gratuite che girano nel telefono. Scarica una voce, incolla un testo e premi Leggi.</p>

<label id="vl">Voce</label>
<select id="voice"></select>
<div id="info"></div>
<div class="bar" id="bar"><i id="bari"></i></div>
<div class="row">
  <button id="dl">⬇ Scarica voce</button>
  <button id="rm">🗑 Rimuovi</button>
</div>

<label>Riproduzione</label>
<select id="mode">
  <option value="el">B · Come un lettore musicale (prova con schermo bloccato)</option>
  <option value="wa">A · Standard (la precedente)</option>
</select>

<label>Velocità: <span id="spv">1.00</span>×</label>
<input type="range" id="sp" min="0.7" max="1.4" step="0.05" value="1">

<label>Testo da leggere</label>
<textarea id="txt">Ciao! Questa è una prova della voce. Il libro costava 20 euro, ma l'ho trovato al 50% di sconto. «Che bella giornata», disse Marco, «andiamo a fare una passeggiata?» La città dormiva ancora, e nelle strade vuote si sentiva soltanto il vento che muoveva le foglie. Dopo qualche minuto, il sole cominciò a salire dietro le colline, e la luce dorata scivolò lentamente sui tetti, sulle finestre e sui campanili. Marco respirò a fondo, chiuse gli occhi e sorrise.</textarea>

<audio id="au" playsinline preload="auto"></audio>
<button id="play" class="acc">▶ Leggi</button>
<div id="sent"></div>
<div id="log"></div>

<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  function $(i) { return document.getElementById(i); }
  var voices = [], busy = false, stopFlag = false, sink = null;

  function log(m) { var l = $('log'); l.textContent += m + '\n'; l.scrollTop = l.scrollHeight; }
  function mb(n) { return n ? Math.round(n / 1e5) / 10 + ' MB' : '? MB'; }
  function cur() { return voices[parseInt($('voice').value, 10)]; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function refresh() {
    var v = cur(); if (!v) return;
    PiperEngine.isDownloaded(v).then(function (d) {
      $('info').textContent = d ? 'Scaricata ✓ (funziona anche offline)' : 'Da scaricare: ' + mb(v.size) + '. Usa il Wi-Fi.';
      $('dl').style.display = d ? 'none' : 'block';
      $('rm').style.display = d ? 'block' : 'none';
    });
  }

  PiperEngine.listVoices().then(function (vs) {
    vs = vs.concat(PiperEngine.candidates || []);   // più le voci non ufficiali da provare
    voices = vs;
    var sel = $('voice');
    vs.forEach(function (v, i) {
      var o = document.createElement('option'); o.value = i; o.textContent = v.label + ' · ' + mb(v.size);
      sel.appendChild(o);
    });
    var i0 = 0; vs.forEach(function (v, i) { if (/paola/.test(v.key)) i0 = i; });
    sel.value = i0; refresh();
    log('Voci italiane trovate: ' + vs.map(function (v) { return v.key; }).join(', '));
  }).catch(function (e) { log('ERRORE elenco voci: ' + e.message); });

  $('voice').onchange = refresh;
  $('sp').oninput = function () { $('spv').textContent = parseFloat(this.value).toFixed(2); };

  function progress(loaded, total, phase) {
    var b = $('bar'); b.style.display = 'block';
    if (phase === 'init') { $('info').textContent = 'Preparo la voce…'; $('bari').style.width = '100%'; return; }
    var p = total ? Math.min(100, Math.round(100 * loaded / total)) : 0;
    $('bari').style.width = p + '%';
    $('info').textContent = 'Scarico… ' + (total ? p + '% (' + mb(loaded) + ' di ' + mb(total) + ')' : mb(loaded));
  }

  $('dl').onclick = function () {
    var v = cur(); if (busy) return; busy = true;
    var t0 = Date.now();
    PiperEngine.loadVoice(v, progress).then(function () {
      log('Voce pronta in ' + ((Date.now() - t0) / 1000).toFixed(1) + ' s');
    }).catch(function (e) { log('ERRORE download: ' + e.message); })
      .then(function () { busy = false; $('bar').style.display = 'none'; refresh(); });
  };
  $('rm').onclick = function () { PiperEngine.removeVoice(cur()).then(refresh); };

  function splitSentences(text) {
    var out = [];
    text.split(/\n+/).forEach(function (p) {
      var parts = p.trim().match(/[\s\S]+?(?:[.!?…]+["'»”’)\]]*(?=\s|$)|$)/g) || [];
      parts.forEach(function (s) { s = s.trim(); if (s) out.push(s); });
    });
    return out;
  }

  // ---------- A) riproduzione standard (Web Audio) ----------
  function WebAudioSink(onIndex) {
    var ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();   // deve partire da un tocco dell'utente
    var nextTime = 0, sources = [], timeline = [], last = -1;
    var timer = setInterval(function () {
      var t = ac.currentTime, k = -1;
      for (var i = 0; i < timeline.length; i++) if (timeline[i].start <= t && t < timeline[i].end) k = timeline[i].i;
      if (k !== last) { last = k; onIndex(k); }
    }, 120);
    return {
      limit: 10,
      add: function (pcm, rate, i) {
        var buf = ac.createBuffer(1, pcm.length, rate);
        buf.getChannelData(0).set(pcm);
        var src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
        var start = Math.max(nextTime, ac.currentTime + 0.1), dur = pcm.length / rate;
        src.start(start); sources.push(src);
        nextTime = start + dur + 0.12;
        timeline.push({ i: i, start: start, end: start + dur + 0.12 });
      },
      ahead: function () { return Math.max(0, nextTime - ac.currentTime); },
      stop: function () { sources.forEach(function (s) { try { s.stop(); } catch (e) {} }); sources = []; clearInterval(timer); onIndex(-1); try { ac.close(); } catch (e) {} }
    };
  }

  // ---------- B) come un lettore musicale (elemento <audio> + comandi di blocco schermo) ----------
  function wav(pcm, rate, padSec) {
    var pad = Math.round(rate * padSec), n = pcm.length + pad;
    var dv = new DataView(new ArrayBuffer(44 + n * 2)), o = 0;
    function s(t) { for (var i = 0; i < t.length; i++) dv.setUint8(o++, t.charCodeAt(i)); }
    s('RIFF'); dv.setUint32(o, 36 + n * 2, true); o += 4; s('WAVEfmt '); dv.setUint32(o, 16, true); o += 4;
    dv.setUint16(o, 1, true); o += 2; dv.setUint16(o, 1, true); o += 2; dv.setUint32(o, rate, true); o += 4;
    dv.setUint32(o, rate * 2, true); o += 4; dv.setUint16(o, 2, true); o += 2; dv.setUint16(o, 16, true); o += 2;
    s('data'); dv.setUint32(o, n * 2, true); o += 4;
    for (var i = 0; i < pcm.length; i++) {
      var x = Math.max(-1, Math.min(1, pcm[i]));
      dv.setInt16(o, x < 0 ? x * 32768 : x * 32767, true); o += 2;
    }
    return new Blob([dv.buffer], { type: 'audio/wav' });
  }
  function ElementSink(onIndex, title) {
    var au = $('au'), q = [], curItem = null, buffered = 0, stopped = false;
    // "sblocco": un suono muto partito dal tocco dell'utente, così iOS permette di continuare da solo
    au.src = URL.createObjectURL(wav(new Float32Array(2205), 22050, 0));
    var p = au.play(); if (p && p.catch) p.catch(function (e) { if (e.name !== 'AbortError') log('Avviso audio: ' + e.message); });
    function next() {
      if (stopped) return;
      if (!q.length) { curItem = null; return; }
      curItem = q.shift();
      au.src = curItem.url;
      var pp = au.play(); if (pp && pp.catch) pp.catch(function (e) { if (e.name !== 'AbortError') log('Avviso audio: ' + e.message); });
      onIndex(curItem.i);
    }
    au.onended = function () {
      if (stopped) return;
      if (curItem) { URL.revokeObjectURL(curItem.url); buffered -= curItem.dur; }
      curItem = null; next();
    };
    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: title || 'Lettura', artist: 'Lettore' });
        navigator.mediaSession.setActionHandler('play', function () { au.play(); });
        navigator.mediaSession.setActionHandler('pause', function () { au.pause(); });
        navigator.mediaSession.setActionHandler('stop', function () { stopAll(); });
      } catch (e) {}
    }
    return {
      limit: 40,   // tengo più audio pronto in anticipo: a schermo bloccato i timer possono rallentare
      add: function (pcm, rate, i) {
        var dur = pcm.length / rate + 0.12;
        q.push({ url: URL.createObjectURL(wav(pcm, rate, 0.12)), dur: dur, i: i });
        buffered += dur;
        if (!curItem) next();
      },
      ahead: function () { return buffered; },
      stop: function () {
        stopped = true; au.pause();
        q.forEach(function (it) { URL.revokeObjectURL(it.url); }); q = [];
        if (curItem) URL.revokeObjectURL(curItem.url);
        onIndex(-1);
        if ('mediaSession' in navigator) { try { navigator.mediaSession.metadata = null; } catch (e) {} }
      },
      idle: function () { return !curItem && !q.length; }
    };
  }

  function stopAll() { stopFlag = true; if (sink) { sink.stop(); sink = null; } }

  $('play').onclick = function () {
    if (busy) { stopAll(); return; }
    var v = cur(); if (!v) return;
    var sents = splitSentences($('txt').value);
    if (!sents.length) return;
    busy = true; stopFlag = false; $('play').textContent = '⏹ Stop';
    var box = $('sent'); box.innerHTML = '';
    var spans = sents.map(function (s) { var e = document.createElement('span'); e.textContent = s + ' '; box.appendChild(e); return e; });
    var speed = parseFloat($('sp').value);
    function mark(k) { spans.forEach(function (s, i) { s.classList.toggle('cur', i === k); }); }

    // il sink va creato qui, subito, dentro il tocco dell'utente
    var mode = $('mode').value;
    sink = mode === 'wa' ? WebAudioSink(mark) : ElementSink(mark, v.label);
    var mySink = sink, state, tot = { gen: 0, aud: 0 };
    log('--- Riproduzione ' + (mode === 'wa' ? 'A (standard)' : 'B (lettore musicale)') + ' · voce ' + v.key + ' ---');

    PiperEngine.loadVoice(v, progress).then(function (st) {
      state = st; $('bar').style.display = 'none'; refresh();
      return st;
    }).then(function () {
      // fonemi a gruppi di 8 frasi (come nell'app): testi lunghi non fanno esaurire la memoria
      var allIds = [], esp = state.cfg.espeak && state.cfg.espeak.voice ? state.cfg.espeak.voice : 'it';
      function ensure(i) {
        if (allIds[i] !== undefined) return Promise.resolve();
        var t0 = Date.now();
        return PiperEngine.phonemize(sents.slice(i, i + 8), esp).then(function (ids) {
          for (var q = 0; q < ids.length; q++) allIds[i + q] = ids[q] || [];
          var okN = ids.filter(function (a) { return a && a.length; }).length;
          log('Fonemi frasi ' + (i + 1) + '-' + (i + ids.length) + ': ' + okN + ' pronte su ' + ids.length + ' (' + (Date.now() - t0) + ' ms)');
        });
      }
      var chain = Promise.resolve();
      sents.forEach(function (s, i) {
        chain = chain.then(function () {
          if (stopFlag) return;
          return ensure(i);
        }).then(function () {
          if (stopFlag || !allIds[i] || !allIds[i].length) return;
          function wait() { return (mySink.ahead() > mySink.limit && !stopFlag) ? sleep(250).then(wait) : null; }
          return Promise.resolve(wait()).then(function () {
            if (stopFlag) return;
            var t0 = performance.now();
            return PiperEngine.run(state, allIds[i], speed).then(function (r) {
              var gen = (performance.now() - t0) / 1000, dur = r.pcm.length / r.rate;
              tot.gen += gen; tot.aud += dur;
              log('Frase ' + (i + 1) + ': ' + gen.toFixed(2) + ' s per ' + dur.toFixed(2) + ' s di audio (×' + (dur / gen).toFixed(1) + ')');
              if (!stopFlag) mySink.add(r.pcm, r.rate, i);
            });
          });
        });
      });
      return chain;
    }).then(function () {
      if (stopFlag) return;
      log('Generazione finita. Totale: ' + tot.gen.toFixed(1) + ' s per ' + tot.aud.toFixed(1) + ' s di audio (×' + (tot.aud / Math.max(tot.gen, 0.01)).toFixed(1) + ')');
      function drain() {
        if (stopFlag) return null;
        if (mySink.idle ? mySink.idle() : mySink.ahead() <= 0.05) return null;
        return sleep(300).then(drain);
      }
      return Promise.resolve(drain());
    }).catch(function (e) { log('ERRORE: ' + (e && e.message ? e.message : e)); })
      .then(function () {
        busy = false; $('play').textContent = '▶ Leggi';
        if (sink === mySink) { mySink.stop(); sink = null; }
        mark(-1);
        log('Lettura terminata.');
      });
  };
})();
</script>
</body>
</html>
